<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Good Food, Good Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: fixed 1280x720 (16:9) stage scaled to fit any screen; ink top bar, paper work area, bottom navigation. Single committed look for classroom projection. */
:root{
  --ink:#0f2f3a; --ink2:#1d4a59; --paper:#f2f8f6; --card:#ffffff;
  --mango:#ffb41f; --mango-ink:#4a3000; --chili:#d93f45; --leaf:#1f8f5c; --sky:#2878bd;
  --line:#d3e3de; --muted:#4f6b75; --ok-bg:#dcf3e6; --bad-bg:#fde2e2; --soft:#e6f0ed;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--ink);font-family:var(--f-body);overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;background:var(--paper);transform-origin:0 0;overflow:hidden;display:flex;flex-direction:column}

/* top bar */
.top{height:64px;flex:none;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 24px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.2px}
.mark{width:36px;height:36px;border-radius:50%;background:var(--mango);color:var(--mango-ink);display:grid;place-items:center;font-size:15px;font-weight:700}
.top .sub{font-family:var(--f-body);font-weight:500;font-size:14px;color:#a9c6cf;margin-left:6px;padding-left:14px;border-left:1px solid #3b6372}
.sp{flex:1}
.tb{border:1px solid #3b6372;background:transparent;color:#fff;border-radius:10px;padding:0 16px;height:40px;font-weight:600;font-size:15px}
.tb:hover{background:var(--ink2)}
.tb.dev{background:var(--mango);border-color:var(--mango);color:var(--mango-ink);font-weight:700}
.tb.dev:hover{background:#ffc547}

/* view */
#view{flex:1;min-height:0;padding:20px 36px 14px;display:flex;flex-direction:column;gap:14px}
.head .row{display:flex;align-items:center;gap:14px}
.head h2{margin:0;font-family:var(--f-display);font-size:32px;font-weight:600;line-height:1.1}
.head p{margin:6px 0 0;color:var(--muted);font-size:16px}
.tag{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:6px}
.tag.m{background:var(--sky);color:#fff}
.tag.l{background:var(--leaf);color:#fff}
.tag.q{background:var(--chili);color:#fff}
.split{flex:1;min-height:0;display:grid;gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:0}
.panel .big{font-size:112px;line-height:1.05}
.panel h3{margin:0;font-family:var(--f-display);font-size:38px;font-weight:600}
.panel .id{color:var(--muted);font-size:18px}
.panel .say{margin-top:6px;background:var(--ink);color:#fff;border:0;border-radius:12px;height:46px;padding:0 22px;font-weight:700;font-size:16px}
.panel .say:hover{background:var(--ink2)}
.panel .line{font-size:20px;font-weight:600;color:var(--ink2)}

/* buttons */
.btn{border:0;border-radius:12px;min-height:46px;padding:0 22px;font-weight:700;font-size:16px;background:var(--ink);color:#fff}
.btn:hover{background:var(--ink2)}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.alt:hover{background:#d5e6e1}
.btn.go{background:var(--mango);color:var(--mango-ink)}
.btn.go:hover{background:#ffc547}
.btn:disabled{opacity:.45;cursor:default}

/* nav */
.nav{height:64px;flex:none;border-top:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:16px;padding:0 36px}
.nav .btn{min-width:150px}
.dots{flex:1;display:flex;justify-content:center;gap:9px}
.dot{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:#c3d6d0}
.dot.on{background:var(--ink);width:34px;border-radius:7px}
.dot.done{background:var(--leaf)}
.ttl{min-width:0;font-size:14px;color:var(--muted);font-weight:600;text-align:center;position:absolute;left:0;right:0;bottom:2px;pointer-events:none}

/* home */
.home{flex:1;min-height:0;display:grid;grid-template-columns:430px 1fr;gap:26px}
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:30px 32px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero .eyebrow{margin:0;color:var(--mango);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.hero h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:54px;line-height:1.02}
.hero .lead{margin:0;color:#b9d3db;font-size:17px}
.hero h3{margin:14px 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#a9c6cf}
.hero ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.hero li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.3}
.hero li:before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--mango);margin-top:6px}
.hero .btn{margin-top:auto;align-self:flex-start;min-height:52px;font-size:18px;padding:0 30px}
.plate{position:absolute;right:-70px;bottom:-70px;width:230px;height:230px;border-radius:50%;background:var(--ink2);display:grid;place-items:center;font-size:84px;opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--ink2)}
.tile .em{font-size:44px;line-height:1}
.tile b{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15;margin-top:auto}
.tile small{color:var(--muted);font-size:13px;line-height:1.3}
.tile .tag{font-size:11px;padding:3px 8px}

/* food */
.food{grid-template-columns:1fr 330px}
.fgrid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:10px;min-height:0}
.fcard{background:var(--card);border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;min-height:0}
.fcard .em{font-size:40px;line-height:1.05}
.fcard b{font-size:15px;font-weight:700}
.fcard:hover{border-color:var(--ink2)}
.fcard.on{border-color:var(--mango);background:#fff7e1}
.fcard.seen:not(.on){background:#f1f8f5}

/* drinks */
.drinks{grid-template-rows:auto 1fr}
.drow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.dcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.dcard .em{font-size:76px;line-height:1.05}
.dcard b{font-family:var(--f-display);font-size:26px;font-weight:600}
.dcard small{color:var(--muted);font-size:15px}
.dcard.on{border-color:var(--mango);background:#fff7e1}
.dcard:hover{border-color:var(--ink2)}

/* builder (taste/texture) */
.build{grid-template-columns:1fr 1fr}
.col{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.col h4{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chips.three{grid-template-columns:repeat(3,1fr)}
.chip{background:var(--soft);border:2px solid transparent;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:17px}
.chip .em{font-size:32px;line-height:1.1}
.chip small{font-weight:500;color:var(--muted);font-size:13px}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:#fff7e1;border-color:var(--mango)}
.bubbles{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;min-height:0}
.bub{display:flex;align-items:center;gap:14px}
.bub.r{flex-direction:row-reverse}
.who{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff}
.who.a{background:var(--sky)}
.who.b{background:var(--leaf)}
.say-b{background:var(--soft);border-radius:18px;padding:14px 20px;font-size:24px;font-weight:600;line-height:1.25}
.bub.r .say-b{background:#fff1cc}
.say-b em{font-style:normal;color:var(--chili);border-bottom:3px solid var(--mango)}
.hint2{margin:0;color:var(--muted);font-size:15px}

/* ask */
.ask{grid-template-columns:1fr 1fr 1fr}
.qline{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:18px;font-weight:600}
.qline.r{background:#fff1cc}
.qline.p{background:#e7f1fb}
.list{display:flex;flex-direction:column;gap:10px}
.rnd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.rnd .qq{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.2}
.rnd .em{font-size:60px}

/* activities */
.score{margin-left:auto;font-weight:700;font-size:16px;background:var(--soft);padding:8px 14px;border-radius:10px}
.act1{grid-template-columns:260px 1fr}
.words{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.wbtn{background:var(--card);border:2px solid var(--line);border-radius:12px;min-height:58px;font-size:20px;font-weight:700}
.wbtn:hover{border-color:var(--ink2)}
.wbtn.sel{border-color:var(--mango);background:#fff7e1}
.wbtn.ok,.pbtn.ok{background:var(--ok-bg);border-color:var(--leaf);cursor:default}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:12px;min-height:0}
.pbtn{background:var(--card);border:2px solid var(--line);border-radius:16px;font-size:68px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
.pbtn small{font-size:15px;font-weight:700;color:var(--leaf)}
.pbtn:hover{border-color:var(--ink2)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:26px;font-weight:700;font-size:17px}
.msg.good{color:var(--leaf)} .msg.bad{color:var(--chili)}
.bank{display:flex;gap:10px;flex-wrap:wrap}
.bk{background:var(--ink);color:#fff;border:0;border-radius:12px;min-height:46px;padding:0 22px;font-size:19px;font-weight:700}
.bk:disabled{background:#c3d6d0;color:#6a858e;cursor:default}
.sent{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.s2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:20px;line-height:1.35}
.s2 .em{font-size:40px}
.blank{min-width:120px;height:42px;border-radius:10px;border:2px dashed #8da9b2;background:var(--soft);font-weight:700;font-size:19px;padding:0 10px;vertical-align:middle}
.blank.focus{border-color:var(--mango);border-style:solid;background:#fff7e1}
.blank.filled{border-style:solid;border-color:var(--ink2);background:#fff}
.blank.ok{background:var(--ok-bg);border-color:var(--leaf)}
.blank.bad{background:var(--bad-bg);border-color:var(--chili)}
.ctl{display:flex;gap:12px;align-items:center}
.cards3{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex:1;min-height:0}
.t3{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.t3 .em{font-size:70px;line-height:1.05}
.t3 b{font-family:var(--f-display);font-size:21px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;margin-top:auto}
.opt{background:var(--soft);border:2px solid transparent;border-radius:10px;min-height:38px;font-weight:700;font-size:15px}
.opt:hover{border-color:var(--ink2)}
.opt.ok{background:var(--ok-bg);border-color:var(--leaf)}
.opt.bad{background:var(--bad-bg);border-color:var(--chili)}
.t3.done{border-color:var(--leaf);background:#f4fbf7}

/* story */
.tabs{display:flex;gap:8px}
.tabb{border:0;background:var(--soft);border-radius:10px;height:42px;padding:0 20px;font-weight:700;font-size:16px}
.tabb.on{background:var(--ink);color:#fff}
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:1;min-height:0}
.scene{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.scene .em{font-size:64px;line-height:1.1}
.scene h5{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px}
.scene p{margin:0;font-size:17px;line-height:1.45;color:#27444e}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.qbox p{margin:0;font-size:18px;font-weight:700}
.qbox .opts{grid-template-columns:1fr;margin-top:0}
.qbox .opt{text-align:left;padding:0 14px;min-height:40px;font-size:16px}

/* final quiz */
.quiz{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.qcard .em{font-size:110px;line-height:1.05}
.qcard .qt{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.2}
.qside{display:flex;flex-direction:column;gap:12px;justify-content:center}
.qside .opt{min-height:62px;font-size:21px;text-align:left;padding:0 20px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.qside .opt.ok{background:var(--ok-bg);border-color:var(--leaf)}
.qside .opt.bad{background:var(--bad-bg);border-color:var(--chili)}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.result{grid-column:1/-1;background:var(--ink);color:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.result .stars{font-size:64px;letter-spacing:6px;color:var(--mango)}
.result h3{margin:0;font-family:var(--f-display);font-size:48px;font-weight:700}
.result p{margin:0;color:#b9d3db;font-size:20px}

/* modal */
.ovl{position:absolute;inset:0;background:rgba(15,47,58,.72);display:grid;place-items:center;z-index:10}
.ovl[hidden]{display:none}
.modal{width:520px;background:var(--card);border-radius:22px;padding:34px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.modal .mark{width:72px;height:72px;font-size:28px;margin-bottom:6px}
.modal .k{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modal h3{margin:0;font-family:var(--f-display);font-size:38px;font-weight:700}
.modal .role{margin:0;font-size:20px;font-weight:600;color:var(--ink2)}
.modal .note{margin:10px 0 14px;color:var(--muted);font-size:15px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    </div>
  </div>
</div>
